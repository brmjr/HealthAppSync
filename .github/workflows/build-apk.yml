name: Build Android APK (v2)

on:
  push:
    branches: [ v2-features, main, master ]
  pull_request:
    branches: [ v2-features, main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR"
          fi
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK & Run Unit Tests
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          cat build.log
          if [ $EXIT_CODE -ne 0 ]; then
            SUMMARY=$(grep -E "(^e: |FAILURE:|What went wrong:|^\* |Caused by:|FAILED)" -A 4 build.log | tail -n 35 | tr '\r\n' '  ')
            echo "::error title=GradleBuildFailure::$SUMMARY"
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy side-by-side download
        run: cp app/build/outputs/apk/debug/app-debug.apk KalorickeTabulky-HealthConnect-v2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KalorickeTabulky-HealthConnect-v2-APK
          path: KalorickeTabulky-HealthConnect-v2.apk
          if-no-files-found: error

      - name: Publish v2 APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "v2.0.${{ github.run_number }} — Side-by-Side v2 Build"
          body: |
            ### KT → Health Connect (v2 Side-by-Side Edition)
            This build uses package ID `cz.kaloricketabulky.healthsync.v2` so you can install it **side-by-side** on your phone without overwriting your stable v1 app (`v1.0.5`).

            **New in v2:**
            - Automatic **Sůl (Salt) → Sodium** conversion for Czech/SK food items
            - Customizable default timestamps (`HH:mm`) for all 6 meal slots
            - **Water Intake (`Pitný režim`) → `HydrationRecord`** sync into Health Connect
            - **Quick Settings Tile** (`Sync KT → Health`) in the Android swipe-down shade
            - **Smart Evening Daily Sync** (default `21:30`) before midnight
            - **Historical Date-Range Backfill** (30 days / current month / previous month / custom range)
            - **In-App GitHub Release Update Checker**, Adaptive App Icon & Material You Dark/Light theme
          files: KalorickeTabulky-HealthConnect-v2.apk
          prerelease: true
